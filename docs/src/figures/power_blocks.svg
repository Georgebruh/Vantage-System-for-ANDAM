<svg xmlns="http://www.w3.org/2000/svg" width="176mm" height="62mm" viewBox="0 0 780 275" font-family="DejaVu Serif, serif" font-size="10.5">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <g fill="none" stroke="#000" stroke-width="1.2">
    <!-- row A: solar input -->
    <rect x="6" y="40" width="82" height="44"/>
    <rect x="106" y="40" width="80" height="44"/>
    <rect x="204" y="40" width="80" height="44"/>
    <rect x="302" y="40" width="96" height="44"/>
    <!-- row B: battery -->
    <rect x="6" y="160" width="82" height="44"/>
    <rect x="106" y="160" width="80" height="44"/>
    <rect x="204" y="160" width="80" height="44"/>
    <rect x="302" y="160" width="96" height="44"/>
    <!-- right: supplies -->
    <rect x="458" y="40" width="98" height="44"/>
    <rect x="574" y="40" width="90" height="44"/>
    <rect x="458" y="160" width="98" height="44"/>
    <rect x="574" y="160" width="90" height="44"/>
    <!-- connections -->
    <path d="M88 62 H106" marker-end="url(#a)"/>
    <path d="M186 62 H204" marker-end="url(#a)"/>
    <path d="M284 62 H302" marker-end="url(#a)"/>
    <path d="M398 62 H434"/>
    <path d="M88 182 H106" marker-end="url(#a)"/>
    <path d="M186 182 H204" marker-end="url(#a)"/>
    <path d="M284 182 H302" marker-end="url(#a)"/>
    <path d="M398 182 H434"/>
    <path d="M434 62 V182" stroke-width="2.6"/>
    <path d="M434 62 H458" marker-end="url(#a)"/>
    <path d="M434 182 H458" marker-end="url(#a)"/>
    <path d="M556 62 H574" marker-end="url(#a)"/>
    <path d="M556 182 H574" marker-end="url(#a)"/>
    <path d="M664 62 H700" marker-end="url(#a)"/>
    <path d="M664 182 H700" marker-end="url(#a)"/>
    <path d="M507 250 V204" marker-end="url(#a)"/>
  </g>
  <g text-anchor="middle">
    <text x="47" y="58">Solar panel</text><text x="47" y="74">6 V (J2)</text>
    <text x="146" y="58">D1 TVS</text><text x="146" y="74">D2 SS34</text>
    <text x="244" y="58">U1 INA226</text><text x="244" y="74">0x40</text>
    <text x="350" y="58">M1 CN3791</text><text x="350" y="74">MPPT charger</text>
    <text x="47" y="178">BT1 1S pack</text><text x="47" y="194">with BMS</text>
    <text x="146" y="178">F1 PTC</text><text x="146" y="194">1.5 A</text>
    <text x="244" y="178">U2 INA226</text><text x="244" y="194">0x44</text>
    <text x="350" y="178">R7 0 Ω</text><text x="350" y="194">battery link</text>
    <text x="507" y="58">U5 RT9080</text><text x="507" y="74">3.3 V LDO</text>
    <text x="619" y="58">U3 MAX40200</text><text x="619" y="74">ideal diode</text>
    <text x="507" y="178">U4 TPS2051B</text><text x="507" y="194">switch</text>
    <text x="619" y="178">U6 MT3608</text><text x="619" y="194">boost 5 V</text>
    <text x="507" y="266">SENS_EN (J1-3), 10 kΩ pull down</text>
  </g>
  <g>
    <text x="440" y="126" font-weight="bold">VBAT</text>
    <text x="704" y="58">+3V3</text><text x="704" y="74">to J1-6</text>
    <text x="704" y="178">Sensor 5 V</text><text x="704" y="194">to J1-4</text>
  </g>
